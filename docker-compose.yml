# Local PostgreSQL for development and tests. Start it with `pnpm db:up`.
# Creates two databases: `formyx` (development) and `formyx_test` (wiped by `pnpm test`).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: formyx
      POSTGRES_PASSWORD: formyx
      POSTGRES_DB: formyx
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U formyx -d formyx']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
