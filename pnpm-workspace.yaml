packages:
  - apps/*
  - packages/*
  - e2e
allowBuilds:
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
# Security fixes for transitive dependencies (pnpm audit). None was reachable from requests:
# exceljs only calls uuid's v4, opentype.js only inflates fonts we ship, and the rest belong to
# the Prisma CLI (which also carries a MySQL driver we never load) and Vite's tooling. CI
# fails on high or critical advisories, so they are patched here until the parents update.
overrides:
  uuid@<11.1.1: ^11.1.1
  fflate@<0.7.5: ^0.7.5
  deepmerge-ts@<8.0.0: ^8.0.0
  mysql2@<3.23.1: ^3.23.1
  source-map-js@<1.2.2: ^1.2.2
