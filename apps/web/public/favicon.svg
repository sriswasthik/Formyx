<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .tile { fill: #18181b; }
    .mark { fill: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #fafafa; }
      .mark { fill: #18181b; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="8"/>
  <rect x="8" y="8" width="16" height="4" rx="2" class="mark"/>
  <rect x="8" y="14" width="12" height="4" rx="2" class="mark"/>
  <rect x="8" y="20" width="4" height="4" rx="1" class="mark"/>
</svg>
