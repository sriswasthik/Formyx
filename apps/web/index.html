<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formyx: build forms people actually enjoy filling in</title>
    <meta
      name="description"
      content="Design beautiful forms, add smart logic and watch responses arrive live. Free to start, with 30 days of Pro and no card."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <!-- Made by pnpm --filter @formyx/e2e render:images, from src/components/brand. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Link previews. %APP_URL% is the site's address (VITE_APP_URL), filled in at build. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Formyx" />
    <meta property="og:title" content="Formyx: build forms people actually enjoy filling in" />
    <meta
      property="og:description"
      content="Design beautiful forms, add smart logic and watch responses arrive live."
    />
    <meta property="og:image" content="%APP_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Formyx: build forms people actually enjoy filling in. The form editor, with a feedback survey."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      // Keep in sync with src/features/theme/theme.ts and src/lib/embed.ts.
      (function () {
        var root = document.documentElement;
        // A public form asks for its questions now, while the app's code downloads, rather than
        // after it has started. src/features/public-form/public-form-api.ts picks this up.
        try {
          var form = /^\/f\/([^/?#]+)/.exec(location.pathname);
          if (form && window.fetch) {
            var slug = decodeURIComponent(form[1]);
            var headers = { Accept: 'application/json' };
            // A password-protected form this tab has unlocked (see form-access.ts).
            var access = null;
            try {
              access = sessionStorage.getItem('formyx:access:' + slug);
            } catch (_) {}
            if (access) headers['X-Form-Access'] = access;
            window.__formyxPrefetch = {
              slug: slug,
              response: fetch('/api/public/forms/' + form[1], {
                credentials: 'include',
                headers: headers,
              }),
            };
          }
        } catch (_) {}
        // A form embedded in another site (/f/:slug?embed=1) has a transparent page and
        // ignores the app's dark mode: the form's own theme decides its colours.
        if (/^\/f\//.test(location.pathname) && /[?&]embed=1(&|$)/.test(location.search)) {
          root.setAttribute('data-embed', '');
          root.style.colorScheme = 'normal';
          return;
        }
        try {
          var stored = localStorage.getItem('formyx-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          var motion = localStorage.getItem('formyx-motion');
          if (motion === 'reduce' || motion === 'full') root.dataset.motion = motion;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
