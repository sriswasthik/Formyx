<!doctype html>
<!--
  Source of public/og-image.png (1200×630), the picture shown when a Formyx link is shared.
  The logo is drawn into [data-logo] (its size in px) by the render script, from the logo's
  shapes. og-screenshot.png is the form editor, captured at 1280×800 from a local app.
  Render it with: pnpm --filter @formyx/e2e render:images
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #fafafa;
        font-family: 'Inter Variable', sans-serif;
        color: #09090b;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 0 0 80px;
        overflow: hidden;
      }
      .copy {
        width: 460px;
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 40px;
      }
      .brand {
        display: flex;
        align-items: center;
        /* 0.4 × the wordmark's size, as in the app's <Logo>. */
        gap: 12.8px;
        font-size: 32px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .brand [data-logo] {
        display: flex;
      }
      h1 {
        font-size: 56px;
        line-height: 1.08;
        font-weight: 600;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      .shot {
        flex: none;
        width: 640px;
        border: 1px solid #e4e4e7;
        border-right: 0;
        border-radius: 12px 0 0 12px;
        overflow: hidden;
        background: #fff;
      }
      .shot img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><span data-logo="48"></span>Formyx</div>
      <h1>Build forms people actually enjoy filling in.</h1>
    </div>
    <div class="shot" aria-hidden="true">
      <img src="og-screenshot.png" alt="" />
    </div>
  </body>
</html>
