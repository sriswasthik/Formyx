    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 180px;
        height: 180px;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 32 32" width="180" height="180" aria-hidden="true">
      <rect width="32" height="32" fill="#18181b" />
      <rect x="8" y="9" width="16" height="3" rx="1.5" fill="#fafafa" />
      <rect x="8" y="14.5" width="11" height="3" rx="1.5" fill="#fafafa" />
      <rect x="8" y="20" width="6" height="3" rx="1.5" fill="#fafafa" />
    </svg>
  </body>
</html>
