# Render Blueprint for the API (which also runs background jobs), the nightly demo reset, and a
# staging API where plans are enforced and Razorpay runs in test mode. In the Render dashboard
# choose New > Blueprint, pick this repository, then fill in every value marked `sync: false`.
# The web app is deployed separately, on Vercel (see "Deployment" in the README); Vercel's
# preview deployments are the staging site.

envVarGroups:
  # Shared by the API and the demo cron job. With Neon, DATABASE_URL is the pooled connection
  # string and DIRECT_URL the direct one, which migrations use.
  - name: formyx-database
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
  # Staging's own database: a branch of the Neon project, never production's data.
  - name: formyx-database-staging
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

services:
  - type: web
    name: formyx-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @formyx/shared build &&
      pnpm --filter @formyx/api build
    # Runs after each build and before the new version takes traffic. A failed migration
    # stops the deploy and the previous version keeps running.
    preDeployCommand: pnpm --filter @formyx/api db:deploy
    startCommand: pnpm --filter @formyx/api start
    healthCheckPath: /api/health
    envVars:
      - fromGroup: formyx-database
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # The Vercel site, e.g. https://formyx.vercel.app. Also allowed to open the live-updates
      # socket, which connects to this service directly.
      - key: CORS_ORIGIN
        sync: false
      # The same address, for links in emails.
      - key: APP_URL
        sync: false
      # Requests arrive through Vercel's proxy and then Render's load balancer.
      - key: TRUST_PROXY
        value: '2'
      - key: DEMO_ENABLED
        value: 'true'
      # Everyone gets every feature during the beta; switch to enforced once plans are sold
      # (staging, below, already is). Switching back to all_unlocked unlocks everything at once.
      - key: ENTITLEMENTS_MODE
        value: all_unlocked
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Seals stored secrets (integration tokens, webhook secrets). Make one with
      # `pnpm --filter @formyx/api keys:new` and keep it safe: losing it means reconnecting.
      - key: ENCRYPTION_KEYS
        sync: false
      # Signing in with Google, and the Google Sheets and Notion integrations; leave empty to
      # hide them.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Signing in with Zoho; leave empty to hide it. ZOHO_ACCOUNTS_URL is the client's data
      # centre (https://accounts.zoho.in for India).
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_ACCOUNTS_URL
        value: https://accounts.zoho.com
      # Trust and safety. REQUIRE_EMAIL_VERIFICATION: switch on once emails reach everyone
      # (a domain verified in Resend). Turnstile keys enable the spam check forms may use;
      # Safe Browsing and BLOCKED_LINK_DOMAINS add to the built-in link blocklist.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: 'off'
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
      - key: BLOCKED_LINK_DOMAINS
        sync: false
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      # Monitoring and product analytics; leave empty to switch them off.
      - key: SENTRY_DSN
        sync: false
      - key: POSTHOG_KEY
        sync: false
      - key: POSTHOG_HOST
        value: https://eu.i.posthog.com
      # Where feedback sent from the app is emailed (it is always stored).
      - key: FEEDBACK_EMAIL
        sync: false

  # Staging: the same code, with plans enforced and Razorpay in test mode, to try billing end to
  # end before it reaches production. Vercel's preview deployments point at it (API_URL).
  - type: web
    name: formyx-api-staging
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @formyx/shared build &&
      pnpm --filter @formyx/api build
    preDeployCommand: pnpm --filter @formyx/api db:deploy
    startCommand: pnpm --filter @formyx/api start
    healthCheckPath: /api/health
    envVars:
      - fromGroup: formyx-database-staging
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # The Vercel preview address (or a staging domain), for CORS and links in emails.
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: TRUST_PROXY
        value: '2'
      - key: DEMO_ENABLED
        value: 'false'
      # Each workspace gets what its plan includes. To roll back, set all_unlocked: every
      # feature is unlocked at once, and nothing stored changes.
      - key: ENTITLEMENTS_MODE
        value: enforced
      # Responses past the monthly limit are still accepted; hard would turn visitors away.
      - key: ENFORCEMENT_MODE
        value: soft
      # Razorpay test mode only (rzp_test_...: the API refuses live keys). The webhook in
      # Razorpay's dashboard points at https://<this service>/api/webhooks/razorpay.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_PRO_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_PRO_YEARLY
        sync: false
      - key: RAZORPAY_PLAN_BUSINESS_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_BUSINESS_YEARLY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ENCRYPTION_KEYS
        sync: false
      - key: SENTRY_DSN
        sync: false

  # Puts the shared demo account back to its starting point every night at 03:00 UTC.
  - type: cron
    name: formyx-demo-reset
    runtime: node
    region: frankfurt
    plan: starter
    schedule: '0 3 * * *'
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @formyx/shared build &&
      pnpm --filter @formyx/api build
    startCommand: pnpm --filter @formyx/api demo:reset
    envVars:
      - fromGroup: formyx-database
      - key: NODE_ENV
        value: production
