name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # API tests run against a real database; its name must end in _test.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: formyx
          POSTGRES_PASSWORD: formyx
          POSTGRES_DB: formyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formyx -d formyx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://formyx:formyx@localhost:5432/formyx_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Known high or critical advisories in any dependency, tooling included. Fix them with
      # an update or an override in pnpm-workspace.yaml.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fails if what a public form downloads grows past its budget; prints every route.
      - name: Bundle size
        run: pnpm --filter @formyx/web size

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: formyx
          POSTGRES_PASSWORD: formyx
          POSTGRES_DB: formyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formyx -d formyx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://formyx:formyx@localhost:5432/formyx
      # Only signs sessions for this throwaway CI database.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Install Playwright browsers
        run: pnpm --filter @formyx/e2e exec playwright install --with-deps chromium webkit

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  visual:
    name: Visual regression (Playwright screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: formyx
          POSTGRES_PASSWORD: formyx
          POSTGRES_DB: formyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formyx -d formyx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://formyx:formyx@localhost:5432/formyx
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      E2E_VISUAL: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Install Playwright browser
        run: pnpm --filter @formyx/e2e exec playwright install --with-deps chromium

      # Every theme preset against e2e/tests/__screenshots__. Until baselines are committed
      # (from the "Visual baselines" workflow), the screenshot tests skip themselves.
      - name: Compare preset screenshots
        run: pnpm test:visual

      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: e2e/playwright-report
          retention-days: 7
